:root {

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;

  line-height: 1.6;
  min-height: 100vh;
}
header { text-align: center; padding: 28px 20px 8px; }
header h1 { font-size: 24px; font-weight: 700; }
header p { color: var(--text-sec); font-size: 14px; margin-top: 4px; }
.tabs { display: flex; justify-content: center; gap: 4px; padding: 0 20px; max-width: 720px; margin: 0 auto; }
.tab {
  flex: 1; padding: 12px 20px; border: 1px solid var(--border); border-bottom: none;
  background: transparent; border-radius: var(--radius) var(--radius) 0 0;
  cursor: pointer; font-size: 15px; color: var(--text-sec); transition: all .15s;
}
.tab.active { background: var(--card-bg); color: var(--primary); font-weight: 600; }
.tab:hover:not(.active) { background: #f0f1f3; }
.panel {
  display: none; max-width: 720px; margin: 0 auto; padding: 24px 20px 60px;
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: 0 0 var(--radius) var(--radius); box-shadow: var(--shadow);
}
.panel.active { display: block; }
.upload-area {
  border: 2px dashed var(--border); border-radius: var(--radius); padding: 48px 20px;
  text-align: center; cursor: pointer; transition: all .2s;
}
.upload-area:hover, .upload-area.dragover { border-color: var(--primary); background: #f5f3ff; }
.upload-area p { color: var(--text); font-size: 16px; font-weight: 500; }
.upload-area .hint { color: var(--text-sec); font-size: 13px; margin-top: 4px; }
.settings { margin-top: 20px; }
.preview-row { display: flex; gap: 20px; align-items: flex-start; margin-bottom: 20px; }
.preview-box {
  flex: 0 0 320px; max-width: 320px; border: 1px solid var(--border);
  border-radius: 8px; overflow: hidden; background: #f9f9f9;
}
.preview-box video, .preview-box img { width: 100%; display: block; }
.info-box { flex: 1; font-size: 13px; color: var(--text-sec); }
.info-box p { margin-bottom: 4px; }
.info-box span { color: var(--text); font-weight: 500; }
.control-group { display: flex; gap: 24px; margin-bottom: 16px; flex-wrap: wrap; }
.control-group label { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text); }
.control-group label > span:first-child { white-space: nowrap; min-width: 70px; }
.control-group input[type="number"] { width: 80px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
.control-group input[type="range"] { width: 120px; }
.control-group select { padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
.hint-inline { color: var(--text-sec); font-size: 12px; }
.target-size-label { flex-wrap: wrap; }
.progress-bar {
  position: relative; width: 100%; height: 32px; background: #f0f1f3;
  border-radius: 8px; overflow: hidden; margin-bottom: 16px;
}
.progress-fill {
  position: absolute; top: 0; left: 0; height: 100%;
  background: linear-gradient(90deg, var(--primary), #818cf8); width: 0%; transition: width .2s;
}
.progress-text {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  color: var(--text); font-size: 13px; font-weight: 500; white-space: nowrap;
}
.btn-primary {
  display: inline-block; padding: 10px 28px; background: var(--primary); color: #fff;
  border: none; border-radius: 8px; font-size: 15px; font-weight: 600;
  cursor: pointer; text-decoration: none; transition: background .15s;
}
.btn-primary:hover { background: var(--primary-hover); }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }
.btn-secondary { background: #fff; color: var(--primary); border: 1px solid var(--primary); margin-left: 10px; }
.btn-secondary:hover { background: #f5f3ff; }
.btn-row { display: flex; align-items: center; }
.btn-row .btn-primary { margin-bottom: 0; }
.btn-remove {

  background: #fff; color: var(--text-sec); border: 1px solid var(--border);

.btn-remove:hover { border-color: #ef4444; color: #ef4444; background: #fef2f2; }
.result { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); }
.result img { max-width: 100%; border-radius: 8px; margin-bottom: 12px; }
.result p { color: var(--text-sec); font-size: 14px; margin-bottom: 12px; }
.compare-row { display: flex; gap: 20px; margin-bottom: 16px; }
.compare-row > div { flex: 1; text-align: center; }
.compare-row img { border: 1px solid var(--border); border-radius: 8px; }
.compare-label { font-weight: 600; color: var(--text); margin-bottom: 8px; }
footer { text-align: center; padding: 20px; color: var(--text-sec); font-size: 12px; }
  </style>

function formatBytes(bytes){if(bytes<1024)return bytes+' B';if(bytes<1024*1024)return(bytes/1024).toFixed(1)+' KB';return(bytes/(1024*1024)).toFixed(2)+' MB'}
function targetToBytes(value,unit){return unit==='MB'?value*1024*1024:value*1024}

document.querySelectorAll('.tab').forEach(function(tab){tab.addEventListener('click',function(){document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active')});tab.classList.add('active');document.getElementById(tab.dataset.tab).classList.add('active')})});

function setupDropArea(dropId,inputId,handler){var drop=document.getElementById(dropId);var input=document.getElementById(inputId);drop.addEventListener('click',function(){input.click()});drop.addEventListener('dragover',function(e){e.preventDefault();drop.classList.add('dragover')});drop.addEventListener('dragleave',function(){drop.classList.remove('dragover')});drop.addEventListener('drop',function(e){e.preventDefault();drop.classList.remove('dragover');if(e.dataTransfer.files[0])handler(e.dataTransfer.files[0])});input.addEventListener('change',function(){if(input.files[0])handler(input.files[0])})}

var videoFile=null;
var lastGifBlob=null; // 视频转出的 GIF，用于直接去压缩
var videoEl=document.getElementById('videoPreview');
setupDropArea('videoDrop','videoInput',function(file){videoFile=file;var url=URL.createObjectURL(file);videoEl.src=url;videoEl.onloadedmetadata=function(){document.getElementById('videoSettings').style.display='block';document.getElementById('videoName').textContent=file.name;document.getElementById('videoDuration').textContent=videoEl.duration.toFixed(1)+' 秒';document.getElementById('videoResolution').textContent=videoEl.videoWidth+'×'+videoEl.videoHeight;document.getElementById('v2gStart').max=videoEl.duration;var durInput=document.getElementById('v2gDuration');durInput.max=videoEl.duration;durInput.value=videoEl.duration.toFixed(1);document.getElementById('v2gResult').style.display='none'}});

document.getElementById('v2gRemove').addEventListener('click',function(){videoFile=null;videoEl.pause();videoEl.removeAttribute('src');videoEl.load();document.getElementById('videoSettings').style.display='none';document.getElementById('v2gResult').style.display='none';document.getElementById('videoInput').value='';document.getElementById('v2gProgress').style.display='none';});

['Fps','Width','Colors'].forEach(function(name){var slider=document.getElementById('v2g'+name);var display=document.getElementById('v2g'+name+'Val');slider.addEventListener('input',function(){display.textContent=slider.value})});

document.getElementById('v2gConvert').addEventListener('click',async function(){if(!videoFile)return;var btn=document.getElementById('v2gConvert');btn.disabled=true;var start=parseFloat(document.getElementById('v2gStart').value)||0;var duration=parseFloat(document.getElementById('v2gDuration').value)||3;var fps=parseInt(document.getElementById('v2gFps').value);var width=parseInt(document.getElementById('v2gWidth').value);var colors=parseInt(document.getElementById('v2gColors').value);var progressBar=document.getElementById('v2gProgress');var progressFill=document.getElementById('v2gProgressFill');var progressText=document.getElementById('v2gProgressText');progressBar.style.display='block';try{var gifBlob=await videoToGIF(videoEl,start,duration,fps,width,colors,function(p,msg){progressFill.style.width=(p*100)+'%';progressText.textContent=msg||'处理中... '+Math.round(p*100)+'%'});lastGifBlob=gifBlob;var url=URL.createObjectURL(gifBlob);document.getElementById('v2gResultImg').src=url;document.getElementById('v2gResultSize').textContent=formatBytes(gifBlob.size);document.getElementById('v2gDownload').href=url;document.getElementById('v2gResult').style.display='block';progressText.textContent='完成！';setTimeout(function(){progressBar.style.display='none'},1500)}catch(err){progressText.textContent='出错: '+err.message;console.error(err)}finally{btn.disabled=false}});

async function videoToGIF(video,start,duration,fps,targetWidth,maxColors,onProgress){var canvas=document.createElement('canvas');var ctx=canvas.getContext('2d',{willReadFrequently:true});var srcW=video.videoWidth;var srcH=video.videoHeight;var scale=targetWidth/srcW;var w=targetWidth;var h=Math.round(srcH*scale);canvas.width=w;canvas.height=h;var end=Math.min(start+duration,video.duration);var effDuration=Math.max(0,end-start);var totalFrames=Math.ceil(effDuration*fps);var frameDelay=1000/fps;var gif=GIFEncoder();await seekTo(video,start);for(var i=0;i<totalFrames;i++){var currentTime=start+i/fps;if(currentTime>=end)break;await seekTo(video,currentTime);ctx.drawImage(video,0,0,w,h);var frameData=ctx.getImageData(0,0,w,h);var data=frameData.data;var palette=quantize(data,Math.min(maxColors,256));var index=applyPalette(data,palette);gif.writeFrame(index,w,h,{palette:palette,delay:frameDelay,transparent:false});onProgress((i+1)/totalFrames,'正在编码第 '+(i+1)+'/'+totalFrames+' 帧')}gif.finish();return new Blob([gif.bytes()],{type:'image/gif'})}
function seekTo(video,time){return new Promise(function(resolve){var onSeeked=function(){video.removeEventListener('seeked',onSeeked);resolve()};video.addEventListener('seeked',onSeeked);video.currentTime=Math.max(0,time)})}

var gifFile=null;var gifFrames=null;var gifRawData=null;
async function loadGifToCompress(blob,name){gifFile=new File([blob],name||'video.gif',{type:'image/gif'});gifRawData=new Uint8Array(await blob.arrayBuffer());var url=URL.createObjectURL(blob);document.getElementById('gifPreview').src=url;document.getElementById('gifSettings').style.display='block';document.getElementById('gifName').textContent=gifFile.name;document.getElementById('gifOrigSize').textContent=formatBytes(blob.size);document.getElementById('gcResult').style.display='none';try{var gifInfo=parseGIF(gifRawData);gifFrames=decompressFrames(gifInfo,true);var w=gifInfo.lsd.width;var h=gifInfo.lsd.height;document.getElementById('gifResolution').textContent=w+'×'+h;document.getElementById('gifFrames').textContent=gifFrames.length}catch(e){console.error('GIF parse error',e);document.getElementById('gifFrames').textContent='解析失败'}}
setupDropArea('gifDrop','gifInput',async function(file){await loadGifToCompress(file,file.name)});

// 视频转出的 GIF 直接去压缩，不用下载再上传
document.getElementById('v2gToCompress').addEventListener('click',async function(){if(!lastGifBlob)return;switchTab('gifcompress');await loadGifToCompress(lastGifBlob,'video.gif');});

function switchTab(tabId){document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active')});var target=document.querySelector('.tab[data-tab="'+tabId+'"]');if(target)target.classList.add('active');document.getElementById(tabId).classList.add('active')}

document.getElementById('gifRemove').addEventListener('click',function(){gifFile=null;gifFrames=null;gifRawData=null;document.getElementById('gifPreview').removeAttribute('src');document.getElementById('gifSettings').style.display='none';document.getElementById('gcResult').style.display='none';document.getElementById('gifInput').value='';document.getElementById('gcProgress').style.display='none';});

['MaxColors','MinWidth','FrameStep'].forEach(function(name){var slider=document.getElementById('gc'+name);var display=document.getElementById('gc'+name+'Val');slider.addEventListener('input',function(){display.textContent=slider.value})});

document.getElementById('gcCompress').addEventListener('click',async function(){if(!gifFrames||!gifRawData)return;var btn=document.getElementById('gcCompress');btn.disabled=true;var targetSize=targetToBytes(parseFloat(document.getElementById('gcTarget').value),document.getElementById('gcUnit').value);var maxColors=parseInt(document.getElementById('gcMaxColors').value);var minWidth=parseInt(document.getElementById('gcMinWidth').value);var frameStep=parseInt(document.getElementById('gcFrameStep').value);var progressBar=document.getElementById('gcProgress');var progressFill=document.getElementById('gcProgressFill');var progressText=document.getElementById('gcProgressText');progressBar.style.display='block';try{var result=await compressGIF(gifFrames,gifRawData,{targetSize:targetSize,maxColors:maxColors,minWidth:minWidth,frameStep:frameStep},function(p,msg){progressFill.style.width=(p*100)+'%';progressText.textContent=msg||'处理中... '+Math.round(p*100)+'%'});var url=URL.createObjectURL(result.blob);document.getElementById('gcAfterImg').src=url;document.getElementById('gcBeforeImg').src=URL.createObjectURL(gifFile);document.getElementById('gcBeforeSize').textContent=formatBytes(gifFile.size);document.getElementById('gcAfterSize').textContent=formatBytes(result.blob.size);var ratio=((1-result.blob.size/gifFile.size)*100).toFixed(1);document.getElementById('gcRatio').textContent='压缩率: '+ratio+'% · 尝试 '+result.attempts+' 轮';document.getElementById('gcDownload').href=url;document.getElementById('gcResult').style.display='block';progressText.textContent='完成！';setTimeout(function(){progressBar.style.display='none'},1500)}catch(err){progressText.textContent='出错: '+err.message;console.error(err)}finally{btn.disabled=false}});

async function compressGIF(frames,rawData,opts,onProgress){var gifInfo=parseGIF(rawData);var origW=gifInfo.lsd.width;var origH=gifInfo.lsd.height;var compositor=document.createElement('canvas');compositor.width=origW;compositor.height=origH;var compCtx=compositor.getContext('2d',{willReadFrequently:true});var rgbaFrames=[];onProgress(0.05,'解码帧数据...');var prevDisposal=0;for(var i=0;i<frames.length;i++){var frame=frames[i];var patchCanvas=document.createElement('canvas');patchCanvas.width=frame.dims.width;patchCanvas.height=frame.dims.height;var patchCtx=patchCanvas.getContext('2d');var patchData=patchCtx.createImageData(frame.dims.width,frame.dims.height);patchData.data.set(frame.patch);patchCtx.putImageData(patchData,0,0);if(prevDisposal===2){compCtx.clearRect(0,0,origW,origH)}compCtx.drawImage(patchCanvas,frame.dims.left,frame.dims.top);var imgData=compCtx.getImageData(0,0,origW,origH);rgbaFrames.push({data:new Uint8ClampedArray(imgData.data),delay:frame.delay||100});if(frame.disposalType===2){compCtx.clearRect(frame.dims.left,frame.dims.top,frame.dims.width,frame.dims.height)}prevDisposal=frame.disposalType}
onProgress(0.2,'开始压缩尝试...');
var strategies=[];strategies.push({scale:1.0,colors:Math.min(128,opts.maxColors)});strategies.push({scale:1.0,colors:Math.min(64,opts.maxColors)});strategies.push({scale:0.75,colors:Math.min(128,opts.maxColors)});strategies.push({scale:0.75,colors:Math.min(64,opts.maxColors)});strategies.push({scale:0.5,colors:Math.min(64,opts.maxColors)});strategies.push({scale:0.5,colors:Math.min(32,opts.maxColors)});strategies.push({scale:0.35,colors:Math.min(32,opts.maxColors)});strategies.push({scale:0.35,colors:16});
var bestBlob=null;var attempts=0;
for(var si=0;si<strategies.length;si++){var scale=strategies[si].scale;var colors=strategies[si].colors;attempts++;var targetW=Math.min(origW,Math.max(opts.minWidth,Math.round(origW*scale)));if(targetW<1)continue;var targetH=Math.round(origH*(targetW/origW));var sampledFrames=[];for(var j=0;j<rgbaFrames.length;j+=opts.frameStep){sampledFrames.push(rgbaFrames[j])}if(sampledFrames.length===0)continue;var gif=GIFEncoder();var origCanvas=document.createElement('canvas');origCanvas.width=origW;origCanvas.height=origH;var origCtx=origCanvas.getContext('2d',{willReadFrequently:true});var scaledCanvas=document.createElement('canvas');scaledCanvas.width=targetW;scaledCanvas.height=targetH;var scaledCtx=scaledCanvas.getContext('2d',{willReadFrequently:true});for(var k=0;k<sampledFrames.length;k++){var frame=sampledFrames[k];var imgData=new ImageData(new Uint8ClampedArray(frame.data),origW,origH);origCtx.putImageData(imgData,0,0);scaledCtx.clearRect(0,0,targetW,targetH);scaledCtx.drawImage(origCanvas,0,0,targetW,targetH);var scaledData=scaledCtx.getImageData(0,0,targetW,targetH);var palette=quantize(scaledData.data,Math.min(colors,256));var index=applyPalette(scaledData.data,palette);var delay=frame.delay*opts.frameStep;gif.writeFrame(index,targetW,targetH,{palette:palette,delay:delay});onProgress(0.2+0.75*((attempts-1+k/sampledFrames.length)/strategies.length),'第 '+attempts+'/'+strategies.length+' 轮 ('+targetW+'px, '+colors+'色) - 帧 '+(k+1)+'/'+sampledFrames.length)}gif.finish();var bytes=gif.bytes();var blob=new Blob([bytes],{type:'image/gif'});if(blob.size<=opts.targetSize){onProgress(1.0,'达标！');return{blob:blob,attempts:attempts}}if(!bestBlob||blob.size<bestBlob.size){bestBlob=blob}onProgress(0.2+0.75*(attempts/strategies.length),'第 '+attempts+'/'+strategies.length+' 轮: '+formatBytes(blob.size)+' (目标 '+formatBytes(opts.targetSize)+')')}
onProgress(1.0,'已用最佳结果');return{blob:bestBlob,attempts:attempts}}
</script>
