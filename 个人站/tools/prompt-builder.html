<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI 生图提示词装配台 · 一步步拼出可出图的提示词</title>
<style>
:root{
  --bg:#f6f5f2; --panel:#fff; --line:#e6e3dc; --line2:#d8d4ca;
  --ink:#23211d; --ink2:#5d5951; --ink3:#918c82;
  --red:#b5453a; --green:#2f7d5d; --blue:#2f5f9e; --amber:#9a6b16;
  --r:10px; --shadow:0 1px 3px rgba(0,0,0,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--blue)}

/* ---------- 顶栏 ---------- */
.top{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:9px 14px; background:rgba(255,255,255,.94); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.brand{font-weight:700; font-size:15px; letter-spacing:.2px; white-space:nowrap}
.brand small{font-weight:400;color:var(--ink3);font-size:12px;margin-left:6px}
.top .sp{flex:1}
.btn{
  border:1px solid var(--line2); background:#fff; border-radius:8px;
  padding:5px 11px; font-size:13px; color:var(--ink2); white-space:nowrap;
}
.btn:hover{border-color:var(--ink3); color:var(--ink)}
.btn.pri{background:var(--ink); color:#fff; border-color:var(--ink)}
.btn.pri:hover{opacity:.88; color:#fff}
.btn.sm{padding:3px 8px; font-size:12px}
.btn.sm.pri2{background:var(--ink); color:#fff; border-color:var(--ink)}
.btn.sm.pri2:hover{opacity:.88}
select.mini{border:1px solid var(--line2); background:#fff; border-radius:8px; padding:5px 8px; font-size:13px}

/* ---------- 布局 ---------- */
.wrap{display:grid; grid-template-columns:210px minmax(0,1fr) 350px; gap:14px; padding:14px; align-items:start; max-width:1560px; margin:0 auto}
.col{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.sticky{position:sticky; top:64px; max-height:calc(100vh - 80px); overflow:auto}

/* ---------- 左：步骤导航 ---------- */
.nav{padding:8px}
.nav h3{margin:6px 8px 8px; font-size:12px; color:var(--ink3); font-weight:600; letter-spacing:.4px}
.step{
  display:flex; align-items:center; gap:8px; width:100%; text-align:left;
  padding:7px 9px; border-radius:8px; margin-bottom:1px; color:var(--ink2);
}
.step:hover{background:#faf9f6}
.step.on{background:var(--ink); color:#fff}
.step.on .sn{background:#fff; color:var(--ink)}
.sn{
  flex:0 0 20px; height:20px; line-height:20px; text-align:center; border-radius:50%;
  background:#eeece6; font-size:11px; font-weight:600; color:var(--ink2);
}
.step.done .sn{background:var(--green); color:#fff}
/* ⭐ 2026-09-27 左侧栏步骤只留标题（说明在中间栏有），整行单行显示 */
.step .st{font-size:12.5px; font-weight:600; line-height:1.3; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
/* 向导第 2 问的输入框与快速词 */
.wzin{width:100%; padding:10px 12px; border:1px solid var(--line2); border-radius:10px; font-size:14px; font-family:inherit; background:#fdfdfc; color:var(--ink)}
.wzin:focus{outline:none; border-color:var(--ink3)}
.wztips{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:10px}
.wztl{font-size:12px; color:var(--ink3)}
.chip.sm{padding:4px 9px; font-size:12px}
/* ⭐ 2026-09-27 带悬停说明（title）的词条加虚线下划线，提示"鼠标放上去有解释"
   （用户：「布光方案的解释，没看到。鼠标放上没有解释浮现」） */
.t[title]{ text-decoration:underline dotted; text-decoration-color:var(--line2); text-underline-offset:3px }
.t.on[title]{ text-decoration-color:rgba(255,255,255,.5) }
.navfoot{border-top:1px solid var(--line); margin-top:8px; padding-top:8px}
.navfoot button{display:block; width:100%; text-align:left; padding:7px 9px; border-radius:8px; font-size:13px; color:var(--ink2)}
.navfoot button:hover{background:#faf9f6}
.navfoot button.on{background:var(--ink);color:#fff}
.navrow{display:flex; flex-wrap:wrap; gap:4px; margin-top:6px}
.navrow .mini{flex:1 1 auto; text-align:center; padding:5px 6px !important; font-size:11.5px; border:1px solid var(--line); border-radius:7px; color:var(--ink2)}
.navrow .mini:hover{background:#faf9f6; border-color:var(--line2)}

/* ---------- 中：当前步骤 ---------- */
.stage{padding:14px 16px 20px}
.stagehd{border-bottom:1px solid var(--line); padding-bottom:10px; margin-bottom:14px}
.stagehd h2{margin:0; font-size:16px}
.stagehd p{margin:4px 0 0; font-size:12.5px; color:var(--ink3)}

.chips{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0}
.chip{
  display:inline-flex; align-items:center; gap:5px;
  border:1px solid var(--line2); background:#fff; border-radius:999px;
  padding:4px 10px; font-size:12.5px; color:var(--ink2);
}
.chip:hover{border-color:var(--ink3); color:var(--ink)}
.chip.on{background:var(--ink); color:#fff; border-color:var(--ink)}
.chip.on:hover{color:#fff}
.chip .x{opacity:.55; font-size:13px; line-height:1}
.chip .x:hover{opacity:1}

.field{margin:12px 0}
.field label{display:block; font-size:12px; color:var(--ink3); margin-bottom:5px; font-weight:600}

.blk{margin:18px 0 0}
/* 词块的三角下拉（点标题收起/展开） */
.blkhd.fold{cursor:pointer; user-select:none}
.blkhd.fold:hover b{color:var(--green)}
.tri{display:inline-block; width:11px; font-size:9px; color:var(--ink3); margin-right:2px}
/* 词块内的语义小分组（段名不可点，只做定位） */
.subgs{margin-top:9px}
.subg{margin:0 0 9px}
.subg:last-child{margin-bottom:0}
.sublb{display:inline-block; font-size:11px; color:var(--ink3); margin:0 0 4px 1px;
  padding-left:7px; border-left:2px solid var(--line2); line-height:1.2}
.blkhd{display:flex; align-items:center; gap:8px; margin-bottom:7px; flex-wrap:wrap}
.blkhd b{font-size:13px}
.blkhd .cnt{font-size:11.5px; color:var(--ink3)}
.blkhd .sp{flex:1}
.terms{display:flex; flex-wrap:wrap; gap:5px}
.t{
  border:1px solid var(--line); background:#fff; border-radius:7px;
  padding:4px 9px; font-size:12.5px; color:var(--ink2); line-height:1.4;
  max-width:100%; text-align:left;
}
.t:hover{border-color:var(--ink3); color:var(--ink); background:#faf9f6}
.t.on{background:var(--ink); color:#fff; border-color:var(--ink)}
.t.on:hover{color:#fff}
.t.adv{border-style:dashed; color:var(--ink3)}

/* 折叠区：冲突 / 慎用 */
.zone{border:1px solid var(--line); border-radius:9px; margin-top:12px; overflow:hidden}
.zone>summary{
  cursor:pointer; padding:8px 11px; font-size:12.5px; color:var(--ink2);
  background:#fbfaf7; list-style:none; display:flex; align-items:center; gap:7px;
}
.zone>summary::-webkit-details-marker{display:none}
.zone>summary::before{content:"▸"; font-size:10px; color:var(--ink3); transition:transform .15s}
.zone[open]>summary::before{transform:rotate(90deg)}
.zone .zbody{padding:10px 11px 12px; border-top:1px solid var(--line)}
.zone.conflict>summary{color:var(--amber)}
.zone.bad>summary{color:var(--red)}
.zn{background:#f1efe9; border-radius:999px; padding:1px 7px; font-size:11px; color:var(--ink2)}
.why{font-size:11.5px; color:var(--ink3); margin:0 0 8px}

textarea.ta{
  width:100%; min-height:64px; resize:vertical; padding:9px 11px;
  border:1px solid var(--line2); border-radius:9px; background:#fff; line-height:1.7;
}
input.tx{width:100%; padding:8px 11px; border:1px solid var(--line2); border-radius:9px; background:#fff}
input.tx:focus,textarea.ta:focus,select.mini:focus{outline:2px solid #d9e2ef; outline-offset:0; border-color:var(--blue)}

.note{border-left:3px solid var(--line2); padding:7px 10px; background:#fbfaf7; border-radius:0 8px 8px 0; font-size:12px; color:var(--ink2); margin:10px 0}

/* 已选条 */
.selbar{border:1px solid var(--line); background:#fbfaf7; border-radius:9px; padding:9px 11px; margin-bottom:4px}
.selbar .lb{font-size:11.5px; color:var(--ink3); margin-bottom:6px; font-weight:600}

/* ---------- 右：成稿 ---------- */
.out{padding:14px}
.outhd{display:flex; align-items:center; gap:8px; margin-bottom:8px}
.outhd b{font-size:13px}
.outhd .sp{flex:1}
#seg{
  width:100%; min-height:300px; padding:12px; border:1px solid var(--line2); border-radius:9px;
  background:#fff; line-height:1.85; font-size:13.5px; resize:vertical;
}
.meta{display:flex; gap:14px; font-size:11.5px; color:var(--ink3); margin:8px 0}
.checks{margin-top:12px; border-top:1px solid var(--line); padding-top:11px}
.ck{display:flex; gap:7px; font-size:12.5px; padding:5px 0; line-height:1.5; color:var(--ink2)}
.ck .dot{flex:0 0 6px; height:6px; border-radius:50%; background:var(--line2); margin-top:8px}
.ck.ok .dot{background:var(--green)}
.ck.warn .dot{background:var(--amber)}
.ck.bad .dot{background:var(--red)}
.ck b{font-weight:600; color:var(--ink)}

/* 搜全库 */
#q{width:100%; padding:9px 11px; border:1px solid var(--line2); border-radius:9px; background:#fff}
.qblk{margin-top:14px}

/* 收藏 */
.fav{display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--line); font-size:12.5px}
.fav .sp{flex:1}
.fav .nm{color:var(--ink2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* 范例库 */
.smp{border:1px solid var(--line); border-radius:9px; padding:11px 12px; margin-bottom:9px; background:#fdfcfa}
.smp:hover{border-color:var(--line2)}
.smphd{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.smphd b{font-size:13.5px}
.smphd .sp{flex:1}
.tag{font-size:11px; color:var(--ink3); background:#f1efe9; border-radius:999px; padding:1px 8px}
.smpd{font-size:12px; color:var(--ink3); margin:4px 0 6px}
.smpp{font-size:12.5px; color:var(--ink2); line-height:1.75; margin:0; padding:8px 10px; background:#fff; border:1px dashed var(--line2); border-radius:7px; white-space:pre-wrap; word-break:break-word}
.smpbar{display:flex; align-items:center; gap:8px; margin-bottom:10px; font-size:12.5px; color:var(--ink2); flex-wrap:wrap}
.smpbar .sp{flex:1}
.badge{font-size:11.5px; background:#eef4ec; color:var(--green); border-radius:999px; padding:2px 9px}

/* 手机 */
.mobar{display:none}
/* ⭐ 2026-09-27 手机断点：项目约定「任何改动先在 ≤560px 自检」，之前只有一个 1180px 断点 */
@media(max-width:560px){
  .wrap{padding:8px; gap:8px}
  .top{padding:8px 10px}
  .brand{font-size:14px}
  .brand small{display:none}
  .stage{padding:10px 11px 16px}
  .stagehd h2{font-size:15px}
  .stagehd p{font-size:12px}
  .chip{padding:6px 10px; font-size:12.5px}
  .chip.sm{padding:3px 7px; font-size:11.5px}
  .t{padding:6px 10px; font-size:13px}
  .blk{margin:14px 0 0}
  .blkhd b{font-size:14px}
  .sublb{font-size:10.5px}
  .wzin{padding:9px 11px; font-size:15px}   /* iOS 上 <16px 会触发缩放，这里保持可读 */
  .step{padding:6px 8px}
  .step .st{font-size:12px}
  #seg{font-size:13.5px; min-height:150px}
  .note{font-size:12px}
  .bads summary{font-size:12.5px}
}
@media(max-width:1180px){
  .wrap{grid-template-columns:1fr; padding:10px; gap:10px}
  .sticky{position:static; max-height:none}
  .nav{display:flex; gap:6px; overflow-x:auto; padding:8px; scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav h3,.nav .sh{display:none}
  .nav .step{flex:0 0 auto; width:auto; padding:6px 10px; margin:0}
  .nav .step .st{font-size:12.5px; white-space:nowrap}
  .navfoot{display:flex; gap:6px; border:0; margin:0; padding:0; border-left:1px solid var(--line); padding-left:6px}
  .navfoot button{width:auto; white-space:nowrap; padding:6px 10px; font-size:12.5px}
  body{padding-bottom:56px}
  .mobar{
    display:flex; align-items:center; gap:8px; position:fixed; left:0; right:0; bottom:0; z-index:50;
    padding:8px 12px; background:rgba(255,255,255,.96); backdrop-filter:blur(8px); border-top:1px solid var(--line);
  }
  .mobar .mt{font-size:12px; color:var(--ink3)}
  .mobar .sp{flex:1}
}
@media print{ .top,.nav,.col.out{display:none} .wrap{display:block} }
</style>
</head>
<body>

<div class="top">
  <div class="brand">AI 生图提示词装配台 <small>一步步拼出可出图的提示词</small></div>
  <div class="sp"></div>
  <button class="btn" id="rnd" title="从当前步骤的候选里随机挑几个">随机一稿</button>
  <button class="btn" id="favBtn">收藏</button>
  <button class="btn" id="reset">重置</button>
</div>

<div class="wrap" role="main">
  <aside class="col nav sticky" id="nav" aria-label="步骤导航"></aside>
  <main class="col stage" id="stage"></main>
  <aside class="col out sticky" id="out" aria-label="成稿预览"></aside>
</div>

<div class="mobar">
  <span class="mt" id="mobMeta"></span>
  <span class="sp"></span>
  <button class="btn" id="mobCopy">复制</button>

function conflictKW(dom,slot){
  var keys=[];
  STEPS.forEach(function(s){ if(s.fields) s.fields.forEach(function(f){ if(state.f[f[0]]) keys.push([f[0], state.f[f[0]]]); }); });
  // 词 vs 词：把当前选中的所有词摊平
  var picked=[];
  Object.keys(state.picks).forEach(function(k){ (state.picks[k]||[]).forEach(function(w){ picked.push(w); }); });
  var hit=[];
  CONFLICT.forEach(function(r){
    if(r.p){ if(picked.indexOf(r.p)>-1) hit.push(r); return; }
    for(var i=0;i<keys.length;i++){
      if(keys[i][0]===r.w[0] && keys[i][1]===r.w[1]){ hit.push(r); break; }
    }
  });
  return hit;
}
function isConflicting(t, rules){
  for(var i=0;i<rules.length;i++){
    var r=rules[i];
    if(r.p && t.zh===r.p) continue;   // 触发词自己不算冲突
    var hs=r.h;
    for(var j=0;j<hs.length;j++){ if(t.zh.indexOf(hs[j])>-1 || t.slot.indexOf(hs[j])>-1) return r.why; }
  }
  return null;
}

/* ---------- 5b. 族：有族的步骤先选族再看词 ---------- */
function famsOf(s){
  if(!s) return null;
  if(s.dyn) return DOM_FAMS[curSubj()] || null;   // 第 4 步：族依赖所选题材域
  return STEP_FAMS[s.k] || null;
}
function famSel(s){
  var fams = visFams(s);
  if(!fams) return null;
  var sel = state.fams[s.k];
  return fams.some(function(x){ return x[0]===sel; }) ? sel : fams[0][0];
}
// 环境步（hideSubjDom）：把「整族都只剩主体域」的分组剔掉，
// 否则主体=风景自然时，默认分组「自然环境」会变空，用户看到"这一组还没有词条"。
function visFams(s){
  var fams = famsOf(s);
  if(!fams || !s || !s.hideSubjDom) return fams;
  var sk = curSubj();
  var kept = fams.filter(function(f){
    return f[1].some(function(g){ return g[0] !== sk; });
  });
  return kept.length ? kept : fams;
}
// 当前「看得见」的分组 → [[域, [要素...]], ...]；渲染与随机一稿共用
function visibleGroups(s){
  if(!s) return [];
  var fams = visFams(s), groups;
  if(fams){
    var row = fams.filter(function(x){ return x[0]===famSel(s); })[0] || fams[0];
    if(s.dyn){ var cur=curSubj(); groups = row[1].map(function(sl){ return [cur,[sl]]; }); }
    else groups = row[1];
  } else if(s.dyn){
    var cur0 = curSubj();
    groups = [[cur0, (DOM_SLOTS[cur0]||[]).filter(function(x){ return SUBJ_EXCLUDE.indexOf(x)<0; })]];
  } else {
    groups = s.groups || [];
  }
  // ⭐ 环境步（hideSubjDom）：主体域整组不显示 —— 主体已经是风景/建筑时，不再重复给同一批词。
  //    注意 allGroups 不过滤：用户先前在环境步选过的词依然要进成稿。
  if(s.hideSubjDom){
    var sk = curSubj();
    groups = groups.filter(function(g){ return g[0] !== sk; });
  }
  return groups;
}
// 该步骤「全部」分组（所有族合并）—— 成稿与完成状态用，不能只看当前族
function allGroups(s){
  if(!s) return [];
  var fams = famsOf(s);
  if(fams){
    if(s.dyn){ var cur=curSubj(); return [[cur, fams.reduce(function(a,r){ return a.concat(r[1]); },[])]]; }
    return fams.reduce(function(a,r){ return a.concat(r[1]); },[]);
  }
  if(s.dyn){
    var cur2 = curSubj();
    return [[cur2, (DOM_SLOTS[cur2]||[]).filter(function(x){ return SUBJ_EXCLUDE.indexOf(x)<0; })]];
  }
  return s.groups || [];
}

function stepDone(s){
  if(s.fields) for(var i=0;i<s.fields.length;i++) if(state.f[s.fields[i][0]]) return true;
  if(s.ta && state.text[s.ta.k]) return true;
  if(s.k==='tail' && state.text.raw) return true;
  var gs = allGroups(s);
  for(var a=0;a<gs.length;a++){
    var dom=gs[a][0], slots=gs[a][1];
    for(var b=0;b<slots.length;b++) if((state.picks[dom+'/'+slots[b]]||[]).length) return true;
  }
  return false;
}

/* ---------- 7. 渲染：词云 ---------- */
function termHTML(t){
  var on=isPicked(t);
  var cls='t'+(on?' on':'')+(t.st==='慎用'?' adv':'');
  var ti=t.note?(' title="'+esc(t.note)+'"'):'';
  return '<button class="'+cls+'"'+ti+' aria-pressed="'+(on?'true':'false')+'" aria-label="'+(on?'已选：':'选择：')+esc(t.zh)+(t.note?'，'+esc(t.note):'')+'" data-d="'+esc(t.d)+'" data-s="'+esc(t.slot)+'" data-z="'+esc(t.zh)+'">'+esc(t.zh)+'</button>';
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function blockHTML(dom, slot, list, rules){
  if(!list.length) return '';
  var ok=[], bad=[];
  list.forEach(function(t){ var w=isConflicting(t,rules); if(w) bad.push([t,w]); else ok.push(t); });
  // ⭐ 2026-09-26 去掉「换一批」分页（用户：步骤拆精准后每块词都不多，第二批常只剩两三个，
  //    不如一次全展示）。原来 130 格里 72 格只有一页，分页纯属多余。
  // ⭐ 2026-09-27 加三角下拉（用户：「因为比较长，每一个部分可以设置一个三角下拉，点击打开，再点击收起」）
  var fk = dom + '/' + slot;
  var folded = !!state.fold[fk];
  var h='<div class="blk"><div class="blkhd fold" role="button" tabindex="0" aria-expanded="'+(folded?'false':'true')+'" data-fold="'+esc(fk)+'">'
   + '<span class="tri">'+(folded ? '▶' : '▼')+'</span><b>'+esc(slot)+'</b>'
   + '<span class="cnt">'+list.length+' 条</span><span class="sp"></span>'
   + '</div>';
  if(folded) return h + '</div>';
  // ⭐ 有语义小分组时按段渲染（段名是不可点的标签，帮用户快速定位）；
  //    没有分组的格还是一整片词。
  var subs = SUBGROUPS[slot];
  if(subs){
    var byZh = {};
    ok.forEach(function(t){ byZh[t.zh] = t; });
    var used = {};
    h += '<div class="subgs">';
    subs.forEach(function(pair){
      var grp = pair[1].map(function(w){ return byZh[w]; }).filter(Boolean);
      if(!grp.length) return;
      grp.forEach(function(t){ used[t.zh] = 1; });
      h += '<div class="subg"><span class="sublb">'+esc(pair[0])+'</span><div class="terms">'
         + grp.map(termHTML).join('') + '</div></div>';
    });
    var rest = ok.filter(function(t){ return !used[t.zh]; });
    if(rest.length){
      h += '<div class="subg"><span class="sublb">其他</span><div class="terms">'
         + rest.map(termHTML).join('') + '</div></div>';
    }
    h += '</div>';
  } else {
    h += '<div class="terms">' + ok.map(termHTML).join('') + '</div>';
  }
  if(bad.length){
    var whys={}; bad.forEach(function(b){ whys[b[1]]=1; });
    // ⚠ bad 里存的是 [词对象, 冲突原因] 数对 —— 不能整个丢给 termHTML，要取 b[0]
    h+='<details class="zone conflict"><summary>与当前选择冲突（'+bad.length+'）<span class="zn">仍可选</span></summary><div class="zbody">'
     + '<p class="why">'+esc(Object.keys(whys).join('；'))+'</p><div class="terms">'
     + bad.slice(0,60).map(function(b){ return termHTML(b[0]); }).join('')
     + '</div></div></details>';
  }
  h+='</div>';
  return h;
}

/* ---------- 8. 渲染：当前步骤 ---------- */
function renderStage(){
  var s=null;
  for(var i=0;i<STEPS.length;i++) if(STEPS[i].k===state.step) s=STEPS[i];
  if(!s){ renderSearch(); return; }
  var rules = conflictKW();
  var h='<div class="stagehd"><h2>第 '+s.n+' 步 · '+esc(s.t)+'</h2><p>'+esc(s.h)+'</p></div>';

  // 字段
  if(s.fields){
    s.fields.forEach(function(f){
      var k=f[0], lb=f[1];
      if(k==='type'){
        h+='<div class="field"><label>'+esc(lb)+'</label><div class="chips">';
        TYPES.forEach(function(tp){
          h+='<button class="chip'+(state.f.type===tp[0]?' on':'')+'" data-f="type" data-v="'+esc(tp[0])+'">'+esc(tp[0])+'</button>';
        });
        h+='</div></div>';
        return;
      }
      if(k==='tail'){ return; }
      var opts=OPTS[k]||[];
      h+='<div class="field"><label>'+esc(lb)+'</label><div class="chips">';
      opts.forEach(function(o){
        if(o==='') return;
        h+='<button class="chip'+(state.f[k]===o?' on':'')+'" data-f="'+k+'" data-v="'+esc(o)+'">'+esc(o)+'</button>';
      });
      h+='</div></div>';
    });
  }

  // 已选
  var picked=[];
  Object.keys(state.picks).forEach(function(k){ state.picks[k].forEach(function(z){ picked.push([k,z]); }); });
  if(picked.length){
    h+='<div class="selbar"><div class="lb">已选 '+picked.length+' 条</div><div class="chips">';
    picked.forEach(function(p){
      h+='<span class="chip on">'+esc(p[1])+'<button class="x" data-un="'+esc(p[0])+'\u0001'+esc(p[1])+'">×</button></span>';
    });
    h+='</div></div>';
  }

  // 快捷插入
  if(s.quick){
    h+='<div class="field"><label>快捷插入</label><div class="chips">';
    s.quick.forEach(function(q){ var qon=!!state.quick[q[1]]; h+='<button class="chip'+(qon?' on':'')+'" data-q="'+esc(q[1])+'">'+(qon?'✓ ':'＋')+esc(q[0])+'</button>'; });
    h+='</div></div>';
  }

  // 手输
  if(s.ta){
    h+='<div class="field"><label>'+esc(s.ta.lb)+'</label><textarea class="ta" data-ta="'+s.ta.k+'" placeholder="'+esc(s.ta.ph)+'">'+esc(state.text[s.ta.k]||'')+'</textarea></div>';
  }
  if(s.k==='tail'){
    h+='<div class="field"><label>还想额外排除什么（会原样接在成稿最后，可选）</label><textarea class="ta" data-ta="raw" placeholder="例：不要出现其他人 / 不要改变产品标签">'+esc(state.text.raw||'')+'</textarea></div>';
  }

  // 族选择器 + 词云（统一步骤 2/3/4/5/6 都用这一套）
  var fams = visFams(s);
  if(fams){
    h+='<div class="field"><label>'+(s.dyn?'题材分组':'分组')+'</label><div class="chips">';
    var fsel = famSel(s);
    fams.forEach(function(x){
      h+='<button class="chip'+(fsel===x[0]?' on':'')+'" data-fam="'+s.k+'\u0001'+esc(x[0])+'">'+esc(x[0])+'</button>';
    });
    h+='</div></div>';
  }
  if(s.dyn){
    h+='<div class="field"><label>题材域</label><div class="chips">';
    SUBJ_DOMS.forEach(function(d){
      h+='<button class="chip'+(curSubj()===d?' on':'')+'" data-subj="'+esc(d)+'">'+esc(DOM_LABEL[d]||d)+'</button>';
    });
    h+='</div></div>';
  }
  if(s.groups || s.dyn || fams){
    var gs = visibleGroups(s), any=false;
    gs.forEach(function(g){ g[1].forEach(function(sl){ var l=pick(g[0],[sl]); if(l.length){ any=true; h+=blockHTML(g[0],sl,l,rules); } }); });
    if(!any) h+='<p class="why">这一组还没有词条，换一个分组看看。</p>';
  }

  // 慎用区：⚠️ 只显示**本步骤能看到的**慎用词。
  //    原来写死 `s.k==='color'` 且 bads 从全库抓 —— 结果把「胸罩/吊带袜」显示在「颜色」步下面。
  //    慎用词该出现在它真正所属的步骤里（内衣在主体步、审美禁区在风格步）。
  var bads=[];
  var visSlots={};
  visibleGroups(s).forEach(function(g){ g[1].forEach(function(sl){ visSlots[g[0]+'/'+sl]=1; }); });
  T.forEach(function(r){ if(r[3]===3){ var t=term(r); if(visSlots[t.d+'/'+t.slot]) bads.push(t); } });
  if(bads.length){
    h+='<details class="zone bad"'+(state.showBad?' open':'')+'><summary>⚠ 慎用区：'+bads.length+' 条 —— 这一步里有'+bads.length+'个词要小心<span class="zn">默认可不用</span></summary>'
     + '<div class="zbody"><p class="why">这些词分两类：一是**赞美语言**（8k / 杰作 / 最高质量），它们不指向任何可画的东西，写进去可能让结果更差；二是**有副作用的词**（敏感品类、商标还原、武器烟酒），部分平台审核会拦。鼠标停上去能看到具体原因。</p>'
     + '<div class="terms">'+bads.slice(0,80).map(termHTML).join('')+'</div></div></details>';
  }

  renderStageOut(h);
}
function renderStageOut(h){
  var el=document.getElementById('stage');
  el.innerHTML=h;
  // 保持滚动位置在切换页码时不跳太多
}

// 每个题材域在成稿里的引导词
var DOM_LEAD = {
  '通用-风格':'风格','通用-光线':'光线','通用-色彩材质':'色彩','通用-镜头构图':'镜头',
  '通用-背景收尾':'收尾','人像':'主体','风景自然':'场景','建筑空间':'空间',
  '产品静物':'产品','食物饮品':'食物','抽象概念':'画面','文字平面':'文字'
};
function curSubj(){
  return state.subj || (state.f.type ? ((typeRow(state.f.type)||[])[1] || '') : '') || '人像';
}
function sentParts(){
  var f=state.f, p=[];
  // ⭐ 2026-09-27 第 0 句：**画面主体**（用户自己写的一句话，最重要，放最前面）
  //    用户：「四个问题有点少，出来的提示词没有主体」——之前向导压根没问"画的是什么内容"
  if(f.subj && f.subj.trim()) p.push(f.subj.trim().replace(/[。，,.\s]+$/,''));
  // 第一句：干什么
  var s1='';
  if(f.use) s1+='为'+f.use+'做的';
  if(f.type) s1+=f.type;
  if(s1) p.push(s1);
  // 第二句：画幅景别 + 成像方式 + 光位影调色温
  var a=[];
  if(f.ratio) a.push(f.ratio);
  if(f.shot) a.push(f.shot);
  // 成像方式当定语：「一张 3:4 竖幅、近景的摄影画面」（不是 +质感，那个对「3D 渲染」读着别扭）
  var s2 = a.length ? ('一张 '+a.join('、')+(f.medium ? ('的'+f.medium) : '')+'画面')
                    : (f.medium ? ('一张'+f.medium+'画面') : '');
  var b=[];
  if(f.light) b.push('光位是'+f.light);
  if(f.tone) b.push('影调走'+f.tone);
  if(f.temp) b.push('色温'+f.temp);
  if(b.length) s2 += (s2 ? '，' : '') + b.join('，');
  if(s2) p.push(s2);
  // ⭐ 快捷插入（第 6 步）：它描述的是光怎么落、脸怎么亮，紧跟在光位那句后面最顺
  Object.keys(state.quick||{}).forEach(function(k){ if(k && k.trim()) p.push(k.trim().replace(/[。，,.\s]+$/,'')); });
  // 按「要素」把选中的词分组成句，顺序就是步骤顺序。
  // ⚠️ 不能按题材域分组：`通用-背景收尾` 这个域横跨第 4 步（背景）和第 9 步（排除项），
  //    按域分组会把「天空」标成「收尾」。按要素分就没有这个问题，标签也更准。
  // ⚠️ 还要按「域/要素」去重：同一个要素可能被两步同时引用
  //    （如主体=建筑空间时，第 2 步和第 4 步都会铺建筑空间的要素）—— 不去重成稿会说两遍。
  var seenSlot = {};
  STEPS.forEach(function(s){
    allGroups(s).forEach(function(g){
      g[1].forEach(function(sl){
        var key = g[0] + '/' + sl;
        if(seenSlot[key]) return;
        seenSlot[key] = 1;
        var w = sel(key);
        if(w.length) p.push((SLOT_LEAD[sl] || sl) + '：' + w.join('、'));
      });
    });
  });
  if(state.text.text) p.push('文字只出现引号内的内容：「'+state.text.text+'」');
  if(state.text.raw) p.push(state.text.raw);
  return p;
}

/* ---------- 状态快照 / 撤销 / 分享 / 收藏导出 ----------
   ⭐ 2026-09-27 新增（用户批准 6 项优化里的 3 项） */
var SHARE_KEYS = ['f','text','subj','mood','quick','sty'];
// ⚠️ 不能直接 JSON.parse(JSON.stringify(x)) —— x 是 undefined 时 stringify 返回 undefined，
//    再 parse 就抛「"undefined" is not valid JSON」（state.mood 初始并不存在，踩过）
function safeClone(x){ try { return JSON.parse(JSON.stringify(x === undefined ? null : x)); } catch(e){ return null; } }
function snap(){
  var o = { picks: safeClone(state.picks) || {} };
  SHARE_KEYS.forEach(function(k){ o[k] = safeClone(state[k]); });
  return o;
}
var SHARE_DEFAULT = { f:{}, text:{}, quick:{}, subj:'', mood:'', sty:'全部' };
function pushUndo(){
  state._undo = state._undo || [];
  state._undo.push(snap());
  if (state._undo.length > 30) state._undo.shift();   // 只留最近 30 步
}
function applySnap(o){
  o = o || {};
  state.picks = safeClone(o.picks) || {};
  SHARE_KEYS.forEach(function(k){
    var v = o[k];
    if (v === undefined || v === null) v = SHARE_DEFAULT[k];
    state[k] = safeClone(v);
  });
  state.sample = '';
}
function undo(){
  state._undo = state._undo || [];
  if (!state._undo.length) return false;
  applySnap(state._undo.pop());
  state.mode = 'step';
  if (!STEPS.some(function(s){ return s.k === state.step; })) state.step = 'spec';
  renderAll();
  return true;
}
/* 分享链接：把配置压进 URL 的 hash（#s=...），打开链接自动还原 */
function b64e(s){ return btoa(unescape(encodeURIComponent(s))).replace(/=+$/, ''); }
function b64d(s){ return decodeURIComponent(escape(atob(s))); }
function shareURL(){
  var o = snap();
  return location.origin + location.pathname + location.search + '#s=' + b64e(JSON.stringify(o));
}
function tryRestoreFromHash(){
  var m = (location.hash || '').match(/[#&]s=([A-Za-z0-9+/_-]+)/);
  if (!m) return false;
  try { applySnap(JSON.parse(b64d(m[1]))); state.mode = 'step'; return true; }
  catch (e) { return false; }
}

/* ---------- 随机一稿 ----------
   ⭐ 2026-09-27 重写。用户：「出来的提示词太短，而是很多时候无意义。
      随机一稿最好可以从每一步都随机选择一些词。」
   旧版只从**当前步骤**的可见槽位挑（第 1 步没词云时退回第 2 步）→ 短、且没有主体。
   新版：① 先随机定字段（类型/用途/成像/光位/影调/色温/景别）
         ② 从题材域里挑一个主体词填进 f.subj —— 成稿才有主体
         ③ 遍历**全部 9 步**的可见分组，每格按概率挑 1 个
         ④ 两两查冲突，互斥的不选；太少时再补一轮
*/
function conflictBetween(a, b, rules){
  for(var i=0;i<rules.length;i++){
    var r=rules[i]; if(!r.p) continue;
    var hs=r.h||[];
    if(r.p===a.zh){ for(var j=0;j<hs.length;j++) if(b.zh.indexOf(hs[j])>-1||b.slot.indexOf(hs[j])>-1) return true; }
    if(r.p===b.zh){ for(var j2=0;j2<hs.length;j2++) if(a.zh.indexOf(hs[j2])>-1||a.slot.indexOf(hs[j2])>-1) return true; }
  }
  return false;
}
function randomDraft(){
  var R=function(a){ return a[Math.floor(Math.random()*a.length)]; };
  var C=function(p){ return Math.random()<p; };
  var rules=CONFLICT||[];
  state.f={}; state.picks={}; state.text={}; state.mood=''; state.sample=''; state.fold={};

  // ① 画面类型打底（它带出题材域 / 景别 / 画幅）
  var tp=R(TYPES);
  state.f.type=tp[0];
  if(tp[1]) state.subj=tp[1];
  if(tp[2]) state.f.shot=tp[2];
  if(tp[3]) state.f.ratio=tp[3];
  // ② 其余字段按概率给，避免每稿都一模一样
  if(C(0.65)){ var u=R(OPTS.use); state.f.use=u; if(USE_RATIO[u]) state.f.ratio=USE_RATIO[u]; }
  if(C(0.85)) state.f.medium=R(OPTS.medium);
  // ⚠️ 光位/影调/景别 **同时有字段和槽位**（第 5、6 步的字段 + 词库里同名的格）。
  //    两边各自随机会撞出「光位是均匀平光…光位：侧光」这种自相矛盾 —— 只走一条：
  //    65% 走字段（更粗更稳），剩下的留给槽位词（更细）。
  var useLightField = C(0.65), useToneField = C(0.6);
  if(useLightField && C(0.95)) state.f.light=R(OPTS.light);
  if(useToneField  && C(0.8))  state.f.tone=R(OPTS.tone);
  if(C(0.7)) state.f.temp=R(OPTS.temp);
  if(C(0.3)) state.f.shot=R(OPTS.shot);   // 景别：TYPES 已经带了一个，别高概率覆盖
  // ③ 主体：从题材域里挑一个「主体类型」级的词 —— 成稿第一句就有东西
  //    ⚠️ 有些域（食物饮品 / 产品静物）没有「主体类型」这类格；
  //       退到别的格会挑出「四十五度角或正俯拍」这种**不是主体**的词
  //       → 这些域备一份默认主体（不写死的域会退回空，成稿就没主体）
  var SUBJ_DEFAULT = {
    '食物饮品': ['一杯拿铁','一份刚端上来的拉面','刚出炉的面包','一盘沙拉','一块芝士蛋糕','一杯冰美式'],
    '产品静物': ['一瓶香水','一支口红','一只机械表','一双球鞋','一部手机','一罐咖啡豆'],
    '建筑空间': ['一座山间小屋','一条老巷子','一个中庭','一座桥上','一间书店'],
    '风景自然': ['一片雾中的松林','一条结冰的河','一夜的星空','一片秋天的草甸'],
    '抽象概念': ['一组同心圆','一片流动的色块','一张由粒子构成的网']
  };
  var dom=state.subj;
  if(dom){
    var prefer=['主体类型','建筑类型','室内空间','概念意象','场景','地形','植被','水体'];
    var slots=DOM_SLOTS[dom]||[], ps=null;
    for(var i=0;i<prefer.length;i++){ if(slots.indexOf(prefer[i])>-1){ ps=prefer[i]; break; } }
    if(ps){
      var pool=LEX.t.filter(function(r){ return LEX.d[r[0]]===dom && LEX.s[r[1]]===ps; });
      if(pool.length) state.f.subj=R(pool)[2];
    }
    if(!state.f.subj && SUBJ_DEFAULT[dom]) state.f.subj=R(SUBJ_DEFAULT[dom]);
  }

  // ④ 遍历全部步骤挑词
  //    ⭐ 三条「别选」规则，都是为了**少出矛盾组合**（用户：很多时候无意义）：
  //      1) 第 2 步的「主体类型」格跳过 —— f.subj 已经从那儿取了一个，再选会出「天使 + 女仆」
  //      2) 文字平面的格只在 海报/KV、信息图/图表 时才选 —— 画建筑不用「字号不超过六档」
  //      3) 「艺术家」与「艺术流派」二选一 —— 会出现「米开朗基罗 + 超现代」
  var isTextType = /海报|信息图|UI/.test(state.f.type||'');
  var TEXT_SLOTS = ['字体','版式','海报元素','信息图元件'];
  var pickedArt = false, pickedSchool = false;
  //    ⭐ 按题材域屏蔽无关格：产品/食物/人像的稿子里不该冒出「白桦林」「季节：夏」
  //       （旧版把 9 步的词全堆一起，必然"什么都有一点" → 用户说「很多时候无意义」）
  var BLOCK = {
    '产品静物': ['地形','水体','植被','季节','时间','结构构件','城市景观','天象'],
    '食物饮品': ['地形','水体','植被','季节','结构构件','城市景观','天象'],
    '人像':     ['结构构件','城市景观','地形','水体','植被','季节'],
    '建筑空间': ['水体','植被','上装','裙装','裤装'],
    '抽象概念': ['水体','植被','结构构件','上装','裙装','裤装']
  };
  var blocked = BLOCK[state.subj] || [];
  //    ⭐ 主体相关约束（用户报：主体「医生」配「儿童，六到十二岁」；主体「怪物」配「南非面孔」）
  //       这类矛盾是**词组之间的语义关系**（职业↔年龄、非人类↔人种面孔），
  //       通用冲突引擎按"词-词"配对覆盖不到 → 按主体类别单独约束。
  var SUBJ_TXT = String(state.f.subj || '');
  // 职业 / 成人身份 → 不可能是幼儿·儿童·少年
  var ADULT_ONLY = /医生|护士|教师|修女|女仆|服务员|魔术师|魔法师|忍者|武士|巫女|女巫|啦啦队|警官|警察|军人|船长|机长|调酒|厨师|建筑师|程序员|画家|作家|侦探/.test(SUBJ_TXT);
  // 非人类 → 不该有人种面孔
  var NONHUMAN = /怪物|幽灵|妖精|小精灵|美人鱼|人偶|巨人|兽人|半兽人|魔鬼|撒旦|骷髅|机械|机器人|史莱姆|魔像|龙|触手|异形/.test(SUBJ_TXT);
  var isYoungAge = function(z){ return /幼儿|儿童|少年/.test(z); };
  var chosen=[], usedSlot={};
  var pass=function(prob){
    STEPS.forEach(function(st){
      if(!st.k) return;
      var gs; try{ gs=visibleGroups(st); }catch(e){ return; }
      (gs||[]).forEach(function(g){
        g[1].forEach(function(sl){
          var key=g[0]+'/'+sl;
          if(usedSlot[key]) return;
          if(sl==='主体类型') return;                       // ①
          if(sl==='光位' && state.f.light) return;           // 字段已定光位，别再选词（否则两条光位打架）
          if(sl==='影调' && state.f.tone)  return;           // 同上
          if(sl==='景别' && state.f.shot)  return;           // 同上
          if(blocked.indexOf(sl)>-1) return;                  // 题材域屏蔽无关格
          if(NONHUMAN && sl==='面孔特征') return;             // 怪物不该有「南非面孔」
          if(TEXT_SLOTS.indexOf(sl)>-1 && !isTextType) return; // ②
          if(sl==='艺术家' && pickedSchool) return;          // ③
          if(sl==='艺术流派' && pickedArt) return;
          if(chosen.length>=14) return;                      // 上限，别堆成怪物
          if(!C(prob)) return;
          var list=pick(g[0],[sl]).filter(function(t){
            if(isConflicting(t,rules)) return false;
            if(ADULT_ONLY && sl==='年龄段' && isYoungAge(t.zh)) return false;  // 医生不该是儿童
            for(var i2=0;i2<chosen.length;i2++) if(conflictBetween(t,chosen[i2],rules)) return false;
            return true;
          });
          if(!list.length) return;
          var t=R(list);
          sel(key).push(t.zh); chosen.push(t); usedSlot[key]=1;
          if(sl==='艺术家') pickedArt=true;
          if(sl==='艺术流派') pickedSchool=true;
        });
      });
    });
  };
  pass(0.32);                                           // 第一轮
  var n=chosen.length;
  if(n<9) pass(0.6);                                    // 太少 → 第二轮放宽
  if(chosen.length<6) pass(1);                          // 还太少 → 全上
  if(chosen.length<6){                                  // ⭐ 仍不够（被题材屏蔽挡住）→ 放开屏蔽再补一轮，保证成稿不至于太短
    blocked=[]; pass(1);
  }
  return chosen.length;
}
document.getElementById('rnd').addEventListener('click', function(){
  pushUndo();                        // ⭐ 随机前压快照，点了后悔可以撤销
  // ⚠️ 必须自己调 renderAll() —— randomDraft() 只改 state、不重渲染。
  //    旧版 handler 末尾有 renderAll()，我重写时漏了 →
  //    用户点「随机一稿」完全没反应（测试也没抓到，因为它直接调函数、没走按钮）。
  randomDraft();
  state.mode='step';
  var has=false; Object.keys(state.picks).forEach(function(k){ if(state.picks[k].length) has=true; });
  if(!has) state.step='subj';     // 万一一个词都没选上，至少停在第 2 步别让用户看着空白
  renderAll();
});
document.getElementById('favBtn').addEventListener('click', function(){
  var name=prompt('给这套组合起个名字：','组合 '+(getFavs().length+1));
  if(!name) return;
  var a=getFavs();
  a.push({name:name, picks:JSON.parse(JSON.stringify(state.picks)), f:JSON.parse(JSON.stringify(state.f)), text:JSON.parse(JSON.stringify(state.text)), subj:state.subj, fams:JSON.parse(JSON.stringify(state.fams))});
  setFavs(a); renderAll();
});
document.getElementById('reset').addEventListener('click', function(){
  if(!confirm('清空所有选择？')) return;
  state.picks={}; state.f={}; state.text={}; state.subj=''; state.fams={}; state.mode='step'; state.step='spec'; renderAll();
});
function copyText(txt){
  if(!txt) return;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ flash('已复制'); }, function(){ fallbackCopy(txt); });
  } else fallbackCopy(txt);
}
function copyOut(){ copyText(state.sample || buildOut()); }
function fallbackCopy(txt){
  var ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.left='-9999px';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); flash('已复制'); }catch(e){ flash('复制失败，请手动选'); }
  document.body.removeChild(ta);
}
function flash(msg){
  var b=document.getElementById('mobCopy'); if(b){ b.textContent=msg; setTimeout(function(){ b.textContent='复制'; },1400); }
  var c=document.getElementById('copy'); if(c){ c.textContent=msg; setTimeout(function(){ c.textContent='复制'; },1400); }
}
document.addEventListener('click', function(e){
  if(e.target.id==='copy'||e.target.id==='mobCopy') copyOut();
  if(e.target.id==='useBuild'){ state.sample=''; renderOut(); }
});

/* ---------- 14. 启动 ---------- */
tryRestoreFromHash();     // ⭐ 分享链接：先试还原
renderAll();
window.__PB__={state:state, buildOut:buildOut, renderAll:renderAll, LEX:LEX, STEPS:STEPS, OPTS:OPTS, TYPES:TYPES, USE_RATIO:USE_RATIO, STEP_FAMS:STEP_FAMS, DOM_FAMS:DOM_FAMS, DOM_SLOTS:DOM_SLOTS, SUBGROUPS:SUBGROUPS, CONFLICT:CONFLICT, isConflicting:isConflicting, randomDraft:randomDraft, undo:undo, shareURL:shareURL, tryRestoreFromHash:tryRestoreFromHash, exportFavs:exportFavs, importFavs:importFavs, SUBJ_EXCLUDE:SUBJ_EXCLUDE, HIDDEN_SLOTS:HIDDEN_SLOTS, visibleGroups:visibleGroups, allGroups:allGroups, visFams:visFams, famSel:famSel};
})();
</script>
